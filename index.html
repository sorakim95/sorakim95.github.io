*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg2)}
body{

.dots{display:flex;gap:6px}

.win-title{flex:1;text-align:center;font-family:var(--pixel);font-size:7px;color:rgba(245,240,232,.5);letter-spacing:.05em}

.term{

}
.term::-webkit-scrollbar{width:5px}
.term::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

.line{margin-bottom:2px;line-height:1.75;font-size:13px;white-space:pre-wrap;word-break:break-word}
.line.prompt-line{display:flex;align-items:flex-start;gap:8px}
.ps1{color:var(--terra);font-family:var(--pixel);font-size:7px;white-space:nowrap;padding-top:3px}

.line.out{color:var(--muted);padding-left:2px}
.line.err{color:var(--terra)}
.line.head{color:var(--text);font-family:var(--pixel);font-size:7px;letter-spacing:.06em;margin:10px 0 5px;border-bottom:1px solid var(--line);padding-bottom:5px}
.line.blank{min-height:10px}
.line b{color:var(--text);font-weight:700}
.te{color:var(--terra)}.mi{color:var(--mint)}.pi{color:var(--pink)}.bl{color:var(--blue)}.ye{color:var(--yellow)}.dm{color:var(--dim)}

@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.line.typed{animation:fadeIn .12s ease forwards}

/* progress bar */
.prog-wrap{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.prog-bar{flex:1;height:8px;background:var(--bg3);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--terra);border-radius:2px;transition:width .05s}

/* input */
.input-row{
  display:flex;align-items:center;gap:8px;
  padding:12px 26px;border-top:1px solid var(--line);
  background:var(--bg2);flex-shrink:0;

.input-ps1{color:var(--terra);font-family:var(--pixel);font-size:7px;white-space:nowrap}
.input-ps1 .sym{color:var(--mint)}

function scrollBottom(){term.scrollTop = term.scrollHeight}

function addLine(cfg, delay=0){
  return new Promise(res=>{
    setTimeout(()=>{
      const div = document.createElement('div');
      div.className = 'line typed ' + (cfg.t==='blank'?'blank':cfg.t==='head'?'head':cfg.t==='err'?'err':'out');
      div.innerHTML = cfg.v || '';
      out.appendChild(div);
      scrollBottom();
      res();
    }, delay);
  });
}

function addPromptLine(text){
  const div = document.createElement('div');
  div.className = 'line prompt-line';
  div.innerHTML = `<span class="ps1">sora@seoul ~<span class="sym"> $</span></span> <span style="font-size:13px">${text}</span>`;
  out.appendChild(div);
}

async function printLines(lines){
  for(let i=0;i<lines.length;i++){

// ── Tab autocomplete ──
const allCmds = Object.keys(commands);
cmd.addEventListener('keydown', e=>{
  if(e.key==='Tab'){
    e.preventDefault();
    const v = cmd.value.toLowerCase();
    const matches = allCmds.filter(c=>c.startsWith(v));
    if(matches.length===1) cmd.value = matches[0];
    else if(matches.length>1){
      addPromptLine(v);
      addLine({t:'out', v: matches.map(m=>`<span class="te">${m}</span>`).join('  ')});
      scrollBottom();
    }
    return;
  }
  // arrow history
  if(e.key==='ArrowUp'){
    e.preventDefault();
    if(hist_idx<history_cmds.length-1){hist_idx++;cmd.value=history_cmds[history_cmds.length-1-hist_idx];}
  }
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(hist_idx>0){hist_idx--;cmd.value=history_cmds[history_cmds.length-1-hist_idx];}
    else{hist_idx=-1;cmd.value='';}
  }
});

// ── Enter ──
cmd.addEventListener('keydown', async e=>{
  if(e.key!=='Enter') return;
  const val = cmd.value.trim().toLowerCase();
  cmd.value='';
  hist_idx=-1;
  if(!val) return;
  history_cmds.push(val);
  addPromptLine(val);
  const fn = commands[val];
  if(!fn){
    await printLines([
      {t:'err', v:`sora-os: command not found: <b>${val}</b>`},
      {t:'err', v:`try <span class="te">help</span> for available commands`},
      {t:'blank'},
    ]);
  } else {
    const result = fn();
    if(result==='__clear__'){out.innerHTML='';}
    else await printLines(result);
  }
});

term.addEventListener('click',()=>cmd.focus());
cmd.focus();
